<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1630" viewBox="0 0 1240 1630" role="img"><title>Cloud Portfolio Platform architecture</title><desc>Generalized implementation architecture. The component table and processing sequence provide a text equivalent.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#bed993"/></marker></defs><rect width="1240" height="1630" rx="16" fill="#172e2a"/><text x="55" y="50" fill="#d9f494" font-family="sans-serif" font-size="21">CLOUD PORTFOLIO PLATFORM / SYSTEM ARCHITECTURE</text><path d="M215.0 204 V247.0 H215.0 V290" stroke="#7f9f79" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="215.0" y="238.0" fill="#cfddc5" text-anchor="middle" font-family="sans-serif" font-size="12">request</text><path d="M215.0 394 V437.0 H215.0 V480" stroke="#7f9f79" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="215.0" y="428.0" fill="#cfddc5" text-anchor="middle" font-family="sans-serif" font-size="12">content delivery</text><path d="M215.0 394 V437.0 H1025.0 V480" stroke="#7f9f79" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="620.0" y="428.0" fill="#cfddc5" text-anchor="middle" font-family="sans-serif" font-size="12">API delivery</text><path d="M620.0 774 V817.0 H620.0 V860" stroke="#7f9f79" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="620.0" y="808.0" fill="#cfddc5" text-anchor="middle" font-family="sans-serif" font-size="12">pipeline</text><path d="M780 912.0 L865 912.0" stroke="#7f9f79" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="822.5" y="900.0" fill="#cfddc5" text-anchor="middle" font-family="sans-serif" font-size="12">build / version</text><path d="M1025.0 964 V1007.0 H620.0 V1050" stroke="#7f9f79" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="822.5" y="998.0" fill="#cfddc5" text-anchor="middle" font-family="sans-serif" font-size="12">deploy image</text><path d="M620.0 1154 V1197.0 H215.0 V1240" stroke="#7f9f79" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="417.5" y="1188.0" fill="#cfddc5" text-anchor="middle" font-family="sans-serif" font-size="12">release state</text><path d="M375 1292.0 H1210 V1102.0 H780" stroke="#7f9f79" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="1205" y="1197.0" fill="#cfddc5" text-anchor="middle" font-family="sans-serif" font-size="12">restore previous</text><path d="M620.0 1154 V1197.0 H1025.0 V1240" stroke="#7f9f79" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="822.5" y="1188.0" fill="#cfddc5" text-anchor="middle" font-family="sans-serif" font-size="12">operational summary</text><path d="M1025.0 1344 V1387.0 H1025.0 V1430" stroke="#7f9f79" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="1025.0" y="1378.0" fill="#cfddc5" text-anchor="middle" font-family="sans-serif" font-size="12">send</text><rect x="55" y="100" width="320" height="104" rx="8" fill="#29463b" stroke="#8cab7d"/><text x="71" y="123" fill="#d9f494" font-family="sans-serif" font-size="12">01</text><text x="71" y="148" fill="#fffef9" font-family="sans-serif" font-size="18" font-weight="bold">Public visitor</text><text x="71" y="176" fill="#d2dfc9" font-family="sans-serif" font-size="13">Portfolio traffic</text><rect x="55" y="290" width="320" height="104" rx="8" fill="#29463b" stroke="#8cab7d"/><text x="71" y="313" fill="#d9f494" font-family="sans-serif" font-size="12">02</text><text x="71" y="338" fill="#fffef9" font-family="sans-serif" font-size="18" font-weight="bold">Route 53 + CloudFront</text><text x="71" y="366" fill="#d2dfc9" font-family="sans-serif" font-size="13">DNS / public delivery</text><rect x="55" y="480" width="320" height="104" rx="8" fill="#29463b" stroke="#8cab7d"/><text x="71" y="503" fill="#d9f494" font-family="sans-serif" font-size="12">03</text><text x="71" y="528" fill="#fffef9" font-family="sans-serif" font-size="18" font-weight="b