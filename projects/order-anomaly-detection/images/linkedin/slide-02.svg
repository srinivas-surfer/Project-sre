<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200"><rect width="1200" height="1200" fill="#172e2a"/><circle cx="1180" cy="70" r="285" fill="#2c4b3d"/><g font-family="sans-serif"><text x="75" y="110" fill="#d9f494" font-size="24">WHY I IMPLEMENTED IT</text><text x="75" y="295" fill="#fffef9" font-size="52" font-weight="bold">The operational problem</text><text x="75" y="570" fill="#d1dec7" font-size="29">The operational task requires collecting counts,</text><text x="75" y="615" fill="#d1dec7" font-size="29">comparing them with expected behavior, deciding which</text><text x="75" y="660" fill="#d1dec7" font-size="29">deviations matter, and preparing an explanation for</text><text x="75" y="705" fill="#d1dec7" font-size="29">the team. Without a consolidated pipeline, those are</text><text x="75" y="750" fill="#d1dec7" font-size="29">separate review and communication steps.</text><path d="M75 990h1030" stroke="#d9f494" stroke-width="4"/><text x="75" y="1090" fill="#fffef9" font-size="23">Srinivas Pitchubabu / Engineering case study</text><text x="1080" y="1090" fill="#d9f494" font-size="23">02</text></g></svg>
