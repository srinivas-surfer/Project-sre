<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1440" viewBox="0 0 1240 1440" role="img"><title>Service Performance Reporting architecture</title><desc>Generalized implementation architecture. The component table and processing sequence provide a text equivalent.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#bed993"/></marker></defs><rect width="1240" height="1440" rx="16" fill="#172e2a"/><text x="55" y="50" fill="#d9f494" font-family="sans-serif" font-size="21">SERVICE PERFORMANCE REPORTING / SYSTEM ARCHITECTURE</text><path d="M215.0 204 V247.0 H215.0 V290" stroke="#7f9f79" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="215.0" y="238.0" fill="#cfddc5" text-anchor="middle" font-family="sans-serif" font-size="12">submit</text><path d="M215.0 394 V437.0 H620.0 V480" stroke="#7f9f79" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="417.5" y="428.0" fill="#cfddc5" text-anchor="middle" font-family="sans-serif" font-size="12">run</text><path d="M1025.0 204 V234 H1212 V450 H620.0 V480" stroke="#7f9f79" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M620.0 584 V627.0 H620.0 V670" stroke="#7f9f79" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="620.0" y="618.0" fill="#cfddc5" text-anchor="middle" font-family="sans-serif" font-size="12">query suite</text><path d="M780 722.0 L865 722.0" stroke="#7f9f79" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="822.5" y="710.0" fill="#cfddc5" text-anchor="middle" font-family="sans-serif" font-size="12">search</text><path d="M1025.0 774 V817.0 H620.0 V860" stroke="#7f9f79" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="822.5" y="808.0" fill="#cfddc5" text-anchor="middle" font-family="sans-serif" font-size="12">aggregations</text><path d="M620.0 964 V1007.0 H620.0 V1050" stroke="#7f9f79" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="