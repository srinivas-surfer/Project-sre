-serif" font-size="12">04</text><text x="476" y="528" fill="#fffef9" font-family="sans-serif" font-size="18" font-weight="bold">Report generator</text><text x="476" y="556" fill="#d2dfc9" font-family="sans-serif" font-size="13">Shared query orchestration</text><rect x="460" y="670" width="320" height="104" rx="8" fill="#29463b" stroke="#8cab7d"/><text x="476" y="693" fill="#d9f494" font-family="sans-serif" font-size="12">05</text><text x="476" y="718" fill="#fffef9" font-family="sans-serif" font-size="18" font-weight="bold">Search adapter</text><text x="476" y="746" fill="#d2dfc9" font-family="sans-serif" font-size="13">requests / retry / response unwrap</text><rect x="865" y="670" width="320" height="104" rx="8" fill="#29463b" stroke="#8cab7d"/><text x="881" y="693" fill="#d9f494" font-family="sans-serif" font-size="12">06</text><text x="881" y="718" fill="#fffef9" font-family="sans-serif" font-size="18" font-weight="bold">Dashboards + OpenSearch</text><text x="881" y="746" fill="#d2dfc9" font-family="sans-serif" font-size="13">Logs / search aggregations</text><rect x="460" y="860" width="320" height="104" rx="8" fill="#29463b" stroke="#8cab7d"/><text x="476" y="883" fill="#d9f494" font-family="sans-serif" font-size="12">07</text><text x="476" y="908" fill="#fffef9" font-family="sans-serif" font-size="18" font-weight="bold">Report context</text><text x="476" y="936" fill="#d2dfc9" font-family="sans-serif" font-size="13">Counts / P90 / endpoints / errors</text><rect x="460" y="1050" width="320" height="104" rx="8" fill="#29463b" stroke="#8cab7d"/><text x="476" y="1073" fill="#d9f494" font-family="sans-serif" font-size="12">08</text><text x="476" y="1098" fill="#fffef9" font-family="sans-serif" font-size="18" font-weight="bold">Jinja2 HTML renderer</text><text x="476" y="1126" fill="#d2dfc9" font-family="sans-serif" font-size="13">Report artifact</text><rect x="55" y="1240" width="320" height="104" rx="8" fill="#29463b" stroke="#8cab7d"/><text x="71" y="1263" fill="#