<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1440" viewBox="0 0 1240 1440" role="img"><title>Peak Traffic Metrics Collector architecture</title><desc>Generalized implementation architecture. The component table and processing sequence provide a text equivalent.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#bed993"/></marker></defs><rect width="1240" height="1440" rx="16" fill="#172e2a"/><text x="55" y="50" fill="#d9f494" font-family="sans-serif" font-size="21">PEAK TRAFFIC METRICS COLLECTOR / SYSTEM ARCHITECTURE</text><path d="M215.0 204 V247.0 H215.0 V290" stroke="#7f9f79" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="215.0" y="238.0" fill="#cfddc5" text-anchor="middle" font-family="sans-serif" font-size="12">parse</text><path d="M215.0 394 V437.0 H620.0 V480" stroke="#7f9f79" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="417.5" y="428.0" fill="#cfddc5" text-anchor="middle" font-family="sans-serif" font-size="12">window</text><path d="M620.0 584 V627.0 H620.0 V670" stroke="#7f9f79" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="620.0" y="618.0" fill="#cfddc5" text-anchor="middle" font-family="sans-serif" font-size="12">scope</text><path d="M620.0 774 V817.0 H620.0 V860" stroke="#7f9f79" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="620.0" y="808.0" fill="#cfddc5" text-anchor="middle" font-family="sans-serif" font-size="12">queries</text><path d="M780 912.0 L865 912.0" stroke="#7f9f79" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="822.5" y="900.0" fill="#cfddc5" text-anchor="middle" font-family="sans-serif" font-size="12">aggregate</text><path d="M1025.0 964 V1007.0 H620.0 V1050" stroke="#7f9f79" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="822.5" y="998.0" fill="#cfddc5" text-anchor="middle" font-family="sans-serif" font-size="12">peak buckets</text><path d="M620.0 1154 V1197.0 H215.0 V1240" stroke="#7f9f79" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="417.5" y="1188.0" fill="#cfddc5" text-anchor="middle" font-family="sans-serif" font-size="12">summarize</text><path d="M620.0 1154 V1197.0 H1025.0 V1240" stroke="#7f9f79" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="822.5" y="1188.0" fill="#cfddc5" text-anchor="middle" font-family="sans-serif" font-size="12">export</text><rect x="55" y="100" width="320" height="104" rx="8" fill="#29463b" stroke="#8cab7d"/><text x="71" y="123" fill="#d9f494" font-family="sans-serif" font-size="12">01</text><text x="71" y="148" fill="#fffef9" font-family="sans-serif" font-size="18" font-weight="bold">Engineer / CLI</text><text x="71" y="176" fill="#d2dfc9" font-family="sans-serif" font-size="13">Start and end review times</text><rect x="55" y="290" width="320" height="104" rx="8" fill="#29463b" stroke="#8cab7d"/><text x="71" y="313" fill="#d9f494" font-family="sans-serif" font-size="12">02</text><text x="71" y="338" fill="#fffef9" font-family="sans-serif" font-size="18" font-weight="bold">Time-window parser</text><text x="71" y="366" fill="#d2dfc9" font-family="sans-serif" font-size="13">Local time to UTC bounds</text><rect x="460" y="480" width="320" height="104" rx="8" fill="#29463b" stroke="#8cab7d"/><text x="476" y="503" fill="#d9f494" font-family="sans-serif" font-size="12">03</text><text x="476" y="528" fill="#fffef9" font-family="sans-serif" font-size="18" font-weight="bold">Scope discovery</text><text x="476" y="556" fill="#d2dfc9" font-family="sans-serif" font-size="13">Entities / index patterns</text><rect x="460" y="670" width="320" height="104" rx="8" fill="#29463b" stroke="#8cab7d"/><text x="476" y="693" fill="#d9f494" font-family="sans-serif" font-size="12">04</text><text x="476" y="718" fill="#fffef9" font-family="sans-serif" font-size="18" font-weight="bold">Collection coordinator</text><text x="476" y="746" fill="#d2dfc9" font-family="sans-serif" font-size="13">Entity × service × interval</text><rect x="460" y="860" width="320" height="104" rx="8" fill="#29463b" stroke="#8cab7d"/><text x="476" y="883" fill="#d9f494" font-family="sans-serif" font-size="12">05</text><text x="476" y="908" fill="#fffef9" font-family="sans-serif" font-size="18" font-weight="bold">Dashboards search client</text><text x="476" y="936" fill="#d2dfc9" font-family="sans-serif" font-size="13">Authenticated search requests</text><rect x="865" y="860" width="320" height="104" rx="8" fill="#29463b" stroke="#8cab7d"/><text x="881" y="883" fill="#d9f494" font-family="sans-serif" font-size="12">06</text><text x="881" y="908" fill="#fffef9" font-family="sans-serif" font-size="18" font-weight="bold">OpenSearch aggregations</text><text x="881" y="936" fill="#d2dfc9" font-family="sans-serif" font-size="13">date_histogram + max_bucket</text><rect x="460" y="1050" width="320" height="104" rx="8" fill="#29463b" stroke="#8cab7d"/><text x="476" y="1073" fill="#d9f494" font-family="sans-serif" font-size="12">07</text><text x="476" y="1098" fill="#fffef9" font-family="sans-serif" font-size="18" font-weight="bold">Result normalization</text><text x="476" y="1126" fill="#d2dfc9" font-family="sans-serif" font-size="13">Peak / interval / timestamp / scope</text><rect x="55" y="1240" width="320" height="104" rx="8" fill="#29463b" stroke="#8cab7d"/><text x="71" y="1263" fill="#d9f494" font-family="sans-serif" font-size="12">08</text><text x="71" y="1288" fill="#fffef9" font-family="sans-serif" font-size="18" font-weight="bold">Console summary</text><text x="71" y="1316" fill="#d2dfc9" font-family="sans-serif" font-size="13">Human review</text><rect x="865" y="1240" width="320" height="104" rx="8" fill="#29463b" stroke="#8cab7d"/><text x="881" y="1263" fill="#d9f494" font-family="sans-serif" font-size="12">09</text><text x="881" y="1288" fill="#fffef9" font-family="sans-serif" font-size="18" font-weight="bold">CSV + JSON exports</text><text x="881" y="1316" fill="#d2dfc9" font-family="sans-serif" font-size="13">Reusable analysis artifacts</text></svg>
