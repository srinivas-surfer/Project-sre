<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200"><rect width="1200" height="1200" fill="#172f2a"/><circle cx="1150" cy="80" r="280" fill="#284d3f"/><g font-family="sans-serif"><text x="75" y="120" fill="#d9f989" font-size="25">02 / THE QUESTION</text><text x="75" y="300" font-size="56" font-weight="bold" fill="#fffef9">Metric explorer</text><text x="75" y="580" font-size="31" fill="#d0dfc6">A last-value card alone can hide a growing trend or</text><text x="75" y="627" font-size="31" fill="#d0dfc6">a brief spike. Different measurement types also</text><text x="75" y="674" font-size="31" fill="#d0dfc6">require different aggregation rules.</text><path d="M75 950h300l60-70 65 100 65-70h550" stroke="#d9f989" stroke-width="7" fill="none"/><text x="75" y="1110" font-size="24" fill="#fffef9">Srinivas Pitchubabu / Synthetic data only</text></g></svg>
