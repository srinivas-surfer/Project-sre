<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1250" viewBox="0 0 1240 1250" role="img"><title>Browser Test Management architecture</title><desc>Generalized implementation architecture. The component table and processing sequence provide a text equivalent.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#bed993"/></marker></defs><rect width="1240" height="1250" rx="16" fill="#172e2a"/><text x="55" y="50" fill="#d9f494" font-family="sans-serif" font-size="21">BROWSER TEST MANAGEMENT / SYSTEM ARCHITECTURE</text><path d="M215.0 204 V247.0 H620.0 V290" stroke="#7f9f79" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="417.5" y="238.0" fill="#cfddc5" text-anchor="middle" font-family="sans-serif" font-size="12">manage</text><path d="M620.0 394 V437.0 H215.0 V480" stroke="#7f9f79" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="417.5" y="428.0" fill="#cfddc5" text-anchor="middle" font-family="sans-serif" font-size="12">record</text><path d="M620.0 394 V437.0 H620.0 V480" stroke="#7f9f79" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="620.0" y="428.0" fill="#cfddc5" text-anchor="middle" font-family="sans-serif" font-size="12">run</text><path d="M620.0 394 V437.0 H1025.0 V480" stroke="#7f9f79" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="822.5" y="428.0" fill="#cfddc5" text-anchor="middle" font-family="sans-serif" font-size="12">lookup</text><path d="M1025.0 584 V627.0 H1025.0 V670" stroke="#7f9f79" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="1025.0" y="618.0" fill="#cfddc5" text-anchor="middle" font-family="sans-serif" font-size="12">stored config</text><path d="M215.0 584 V627.0 H215.0 V670" stroke="#7f9f79" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="215.0" y="618.0" fill="#cfddc5" text-anchor="middle" font-family="sans-serif" font-size="12">write</text><path d="M215.0 774 V817.0 H620.0 V860" stroke="#7f9f79" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="417.5" y="808.0" fill="#cfddc5" text-anchor="middle" font-family="sans-serif" font-size="12">test input</text><path d="M620.0 584 V614 H30 V830 H620.0 V860" stroke="#7f9f79" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M620.0 584 V627.0 H1025.0 V670" stroke="#7f9f79" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="822.5" y="618.0" fill="#cfddc5" text-anchor="middle" font-family="sans-serif" font-size="12">run metadata</text><path d="M780 912.0 L865 912.0" stroke="#7f9f79" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="822.5" y="900.0" fill="#cfddc5" text-anchor="middle" font-family="sans-serif" font-size="12">browser steps</text><path d="M620.0 964 V1007.0 H620.0 V1050" stroke="#7f9f79" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="620.0" y="998.0" fill="#cfddc5" text-anchor="middle" font-family="sans-serif" font-size="12">result</text><path d="M780 1102.0 H1198 V342.0 H780" stroke="#7f9f79" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="55" y="100" width="320" height="104" rx="8" fill="#29463b" stroke="#8cab7d"/><text x="71" y="123" fill="#d9f494" font-family="sans-serif" font-size="12">01</text><text x="71" y="148" fill="#fffef9" font-family="sans-serif" font-size="18" font-weight="bold">Engineer / browser UI</text><text x="71" y="176" fill="#d2dfc9" font-family="sans-serif" font-size="13">Manage tests / runs / reports</text><rect x="460" y="290" width="320" height="104" rx="8" fill="#29463b" stroke="#8cab7d"/><text x="476" y="313" fill="#d9f494" font-family="sans-serif" font-size="12">02</text><text x="476" y="338" fill="#fffef9" font-family="sans-serif" font-size="18" font-weight="bold">Express + authentication</text><text x="476" y="366" fill="#d2dfc9" font-family="sans-serif" font-size="13">HTTP API / WebSocket events</text><rect x="55" y="480" width="320" height="104" rx="8" fil